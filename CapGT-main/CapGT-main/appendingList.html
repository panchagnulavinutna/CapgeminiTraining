<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List from Array of Objects</title>
</head>
<body>
    <ul id="itemList"></ul>

    <script>

        const items =[
            {name: "Apple", category: "Fruit"},
            {name: "Carrot", category: "Vegetable"},
            {name: "Banana", category: "Fruit"},
            {name: "Broccoli", category: "Vegetable"}
        
        ];

        function insertItemsIntoList(itemsArray) {
            const listElement = document.getElementById("itemList");     

            const listItems = itemsArray.map(item => 
                `<li>${item.name} - ${item.category}</li>`
            );                                                            
            listElement.innerHTML = listItems.join("");                  
        }

        insertItemsIntoList(items);
    </script>
</body>
</html>
